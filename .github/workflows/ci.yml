name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node reference + demos + lap-git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reference library (incl. integrity + audit canaries)
        run: cd lap-reference && node --test test/
      - name: Single-process demo + morning replay (191 checks) + tamper detection
        run: |
          cd lap-demo
          node demo.js
          node replay.js
          # --tamper is EXPECTED to exit non-zero (it detects a planted edit); under
          # `bash -eo pipefail` that must be caught with `if`, not `; test $?`.
          if node replay.js --tamper; then echo "FAIL: tamper was not detected"; exit 1; else echo "OK: tamper correctly detected (non-zero exit expected)"; fi
      - name: lap-git self-test
        run: node lap-git/lap-git.mjs selftest

  python:
    name: Python port (same vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./lap-python pytest
      - run: python -m pytest lap-python/tests -q

  mcp-example:
    name: MCP example on ${{ matrix.mcp }} (real stdio round-trip)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["mcp>=1.2,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./lap-python "${{ matrix.mcp }}"
      - name: client spawns the LAP-protected server; expect one paid call + four refusals
        run: |
          cd examples/mcp-server
          python client.py | tee out.txt
          grep -q "receipt verified" out.txt
          test "$(grep -c REFUSED out.txt)" = "4"

  packaging:
    name: Packages build and pass checks (npm pack, PyPI build + twine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm package packs with only the intended files
        run: |
          cd lap-reference
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "src/index.js" pack.txt && grep -q "LICENSE" pack.txt && ! grep -q "test/" pack.txt
      - name: PyPI package builds and passes twine check
        run: |
          pip install build twine
          cd lap-python && python -m build && python -m twine check dist/*
