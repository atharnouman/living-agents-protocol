[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "living-agents"
version = "0.4.10"
description = "Living Agents Protocol (LAP) Python reference implementation and FastMCP middleware: LIP-1 Passport, LIP-3 Scope Algebra, LIP-4 Micro-Core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Athar Nouman" }]
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
mcp = [
    "mcp>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
